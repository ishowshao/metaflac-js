name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install official FLAC tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y flac
      - name: Install official FLAC tools (macOS)
        if: runner.os == 'macOS'
        run: brew list flac || brew install flac
      - run: npm ci --ignore-scripts
      - run: flac --version && metaflac --version
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run test:package
